name: CI File Upload Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MinIO Server
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            quay.io/minio/minio server /data
          
          echo "Waiting for MinIO..."
          until curl -s -f http://localhost:9000/minio/health/live; do
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # CORRECTION : Le fichier est à la racine du dépôt
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          # CORRECTION : Plus besoin de faire 'cd', on est déjà au bon endroit
          npm ci

      - name: Run Tests
        env:
          # Configuration pour la connexion locale dans GitHub Actions
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          NODE_ENV: test
        run: |
          # On lance les tests directement à la racine
          npm test
