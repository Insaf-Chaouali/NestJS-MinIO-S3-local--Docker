name: CI File Upload Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        # On force le démarrage du serveur directement dans les options Docker
        options: >-
          --entrypoint "/usr/bin/docker-entrypoint.sh"
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Dans GitHub Actions, les arguments après l'image pour un service 
        # se placent via la commande par défaut de l'image si possible, 
        # ou en surchargeant l'entrypoint. Voici la syntaxe qui passe :
        args: server /data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './FILE-UPLOAD-SERVICE/package-lock.json'

      - name: Install dependencies
        run: |
          cd FILE-UPLOAD-SERVICE
          npm ci

      - name: Run Tests
        env:
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          NODE_ENV: test
        run: |
          cd FILE-UPLOAD-SERVICE
          npm test
