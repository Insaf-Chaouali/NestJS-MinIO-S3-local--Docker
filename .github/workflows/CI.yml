name: CI File Upload Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        # Correction syntaxe : On utilise 'options' pour passer la commande de démarrage
        # L'image minio/minio a besoin de l'argument 'server /data'
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Commande par défaut pour démarrer le serveur MinIO
        entrypoint: /usr/bin/docker-entrypoint.sh
        args: server /data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Assurez-vous que ce chemin pointe vers votre package-lock.json
          cache-dependency-path: './FILE-UPLOAD-SERVICE/package-lock.json'

      - name: Install dependencies
        run: |
          cd FILE-UPLOAD-SERVICE
          npm ci

      - name: Run Tests
        env:
          # Configuration pour que le code Node.js puisse joindre MinIO
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          NODE_ENV: test
        run: |
          cd FILE-UPLOAD-SERVICE
          npm test
