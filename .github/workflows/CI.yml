name: CI File Upload Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        # On injecte la commande server /data directement dans options via un shell
        options: >-
          --entrypoint /bin/sh
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Astuce : GitHub permet de passer la commande finale après l'image via cette syntaxe
        # Mais pour éviter toute erreur de schéma, on peut aussi l'omettre si l'image est bien configurée.
        # Ici, on utilise la méthode la plus compatible :
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './FILE-UPLOAD-SERVICE/package-lock.json'

      - name: Install dependencies
        run: |
          cd FILE-UPLOAD-SERVICE
          npm ci

      - name: Run Tests
        env:
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          NODE_ENV: test
        run: |
          # On s'assure que MinIO est prêt et on lance les tests
          cd FILE-UPLOAD-SERVICE
          npm test
